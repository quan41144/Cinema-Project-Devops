server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: cinema-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cinema_catalog_db}
    username: ${DB_USERNAME:cinema_user}
    password: ${DB_PASSWORD:cinema_pass}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
management:
  endpoints:
    web:
      exposure:
        include: health
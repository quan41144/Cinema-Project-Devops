server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: customer-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cinemabox_audience_db}
    username: ${DB_USERNAME:audience_user}
    password: ${DB_PASSWORD:audience_pass}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
jwt:
  secret: ${JWT_SECRET_KEY:cinemabox-dev-secret-key-2026-at-least-32-bytes-long}
  expiration-ms: ${JWT_EXPIRED_ACCESS:86400000}
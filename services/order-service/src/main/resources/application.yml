server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cinemabox_booking_db}
    username: ${DB_USERNAME:booking_user}
    password: ${DB_PASSWORD:booking_pass}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

services:
  cinema-url: http://${CINEMA_SVC_HOST:localhost}:${CINEMA_SVC_PORT:8081}
  customer-url: http://${CUSTOMER_SVC_HOST:localhost}:${CUSTOMER_SVC_PORT:8082}
  ticket-url: http://${TICKET_SVC_HOST:localhost}:${TICKET_SVC_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: cinemabox-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - cinema-service:8081
          - customer-service:8082
          - order-service:8083
          - ticket-service:8084

  - job_name: ec2-hardware
    metrics_path: /metrics
    static_configs:
      - targets:
          - node-exporter:9100

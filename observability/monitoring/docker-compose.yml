services:
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: cinemabox-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - cinema-net
    restart: always

  node-exporter:
    image: prom/node-exporter:v1.6.0
    container_name: cinemabox-node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    networks:
      - cinema-net
    restart: always

  grafana:
    image: grafana/grafana:10.0.3
    container_name: cinemabox-grafana
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-CinemaBox@2026}
      GF_SERVER_ROOT_URL: https://cinema-project-quan-devops.duckdns.org/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    depends_on:
      - prometheus
    networks:
      - cinema-net
    restart: always

volumes:
  prometheus-data:
  grafana-data:

networks:
  cinema-net:
    external: true

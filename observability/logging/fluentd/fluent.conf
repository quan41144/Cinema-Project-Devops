<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<filter cinemabox.**>
  @type parser
  key_name log
  reserve_data true
  remove_key_name_field true
  <parse>
    @type json
  </parse>
</filter>

<filter cinemabox.**>
  @type record_transformer
  enable_ruby true
  remove_keys log
  <record>
    message ${record["message"] || record["log"]}
  </record>
</filter>

<match cinemabox.**>
  @type elasticsearch
  host elasticsearch
  port 9200
  scheme http
  logstash_format true
  logstash_prefix cinemabox
  logstash_dateformat %Y.%m.%d
  include_tag_key true
  tag_key fluentd_tag
  suppress_type_name true
  log_es_400_reason true
  <buffer>
    @type file
    path /fluentd/buffer/cinemabox
    flush_mode interval
    flush_interval 5s
    retry_forever true
    chunk_limit_size 8m
    total_limit_size 512m
  </buffer>
</match>

<label @FLUENT_LOG>
  <match **>
    @type stdout
  </match>
</label>

<match **>
  @type stdout
</match>
